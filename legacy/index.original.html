<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario Casero</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFBF7;--card:#fff;--ink:#2A2230;--mut:#8A8190;--terra:#5A2A6B;--oli:#5A2A6B;--mos:#E8A93B;--line:#EDE6EF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1722;--card:#2A2130;--ink:#F4ECF6;--mut:#B5A8BB;--line:#3C3044;--terra:#8E5BA8;--oli:#5A2A6B}}
:root[data-theme="dark"]{--bg:#1E1722;--card:#2A2130;--ink:#F4ECF6;--mut:#B5A8BB;--line:#3C3044;--terra:#8E5BA8;--oli:#5A2A6B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,rgba(90,42,107,.12),rgba(90,42,107,0) 300px) no-repeat,var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
#root{max-width:430px;margin:0 auto;padding:16px 16px 100px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h1{font-size:28px;letter-spacing:-.5px}body,button,input,summary,h1,h2,h3,.rc b,.vc b,nav button,.chip,.btn,.tag{font-family:Poppins,system-ui,sans-serif!important}h1,h2,h3{font-weight:600}.vc b,.rc b{font-weight:600;font-size:15px}.top small{color:var(--mut)}
.gear{background:var(--card);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:18px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(120,80,40,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:10px 16px;font:600 14px Nunito,sans-serif;min-height:44px}
.chip.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn{background:var(--terra);color:#fff;border:0;border-radius:14px;padding:13px 18px;font:700 16px Nunito,sans-serif;min-height:48px;width:100%}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.rc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(120,80,40,.08)}
.rc b{display:block;font-family:Fraunces,serif;font-size:17px}.rc small{color:var(--mut)}
.art{flex:none;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-size:34px;overflow:hidden;position:relative}.art svg{width:100%;height:100%;display:block}
.art.big{width:100%;height:230px;border-radius:20px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .note{grid-column:1/-1}.vc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.vc .art{width:100%;height:120px;border-radius:0}.vc .vb{padding:10px 12px 12px}.vc b{display:block;font:600 16px Fraunces,serif;line-height:1.2;margin-bottom:2px}.vc small{color:var(--mut)}.vc .heart{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9);border-radius:50%;width:38px;height:38px;min-width:0;min-height:0;font-size:20px;display:grid;place-items:center;padding:0}
.rc>div:nth-child(2){flex:1}
.heart{border:0;background:none;font-size:26px;color:var(--terra);min-width:44px;min-height:44px}
.hero{position:relative;overflow:hidden;min-height:200px;border-radius:22px;padding:18px;color:#fff;background:var(--oli);margin-bottom:14px;display:flex;align-items:flex-end;box-shadow:0 8px 20px rgba(90,42,107,.25)}.hero>div:first-child{position:relative;z-index:2}
.hero .e{position:absolute;inset:0;overflow:hidden}.hero .e svg,.hero .e img{width:100%;height:100%;object-fit:cover;display:block}.hero .e::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(35,12,45,.85),rgba(35,12,45,.05) 70%)}.hero small{opacity:.9}
input[type=text],input[type=tel],input[type=search]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 14px;font:16px Nunito,sans-serif;min-height:48px;margin-bottom:10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px Nunito,sans-serif;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--terra)}
ul.ing{padding-left:20px;margin:6px 0 12px}ol{padding-left:22px}li{margin-bottom:6px}
.map{width:100%;border-radius:16px;border:1px solid var(--line);background:#EFEAF2;display:block;margin-bottom:10px}
.tag{display:inline-block;background:#FBEBC8;color:#7A4B00;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:6px}
.sheet{position:fixed;inset:0;background:rgba(40,25,15,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:min(430px,100%);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
summary{font:700 16px Fraunces,serif;min-height:30px}
details p{color:var(--mut);margin:8px 0 0;line-height:1.5}
.msgs{max-height:230px;overflow:auto;margin-bottom:8px}
.m{padding:9px 12px;border-radius:14px;margin-bottom:6px;max-width:88%;line-height:1.4;font-size:15px}
.m.u{background:var(--terra);color:#fff;margin-left:auto}.m.b{background:var(--line)}
.row{display:flex;gap:8px}.row input{margin:0}.row .btn{width:auto}
.bar{height:8px;background:var(--line);border-radius:6px;margin:6px 0 16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--oli)}
.note{font-size:13px;color:var(--mut)}
.wa{background:#E7DDCB;border-radius:18px;padding:14px;margin:10px 0}
.bub{background:#fff;color:#333;border-radius:12px;padding:10px 12px;max-width:90%;box-shadow:0 1px 2px rgba(0,0,0,.15);font-size:15px}
.bub .lk{margin-top:6px;border-radius:8px;background:#EEF3F7;padding:8px;font-size:13px;color:#2D6A9F}
</style>

arroz:'<circle cx="50" cy="50" r="24" fill="#FBF3E4" stroke="#E4D3B8" stroke-width="3"/><g fill="#B5651D"><circle cx="44" cy="46" r="1.6"/><circle cx="54" cy="44" r="1.6"/><circle cx="50" cy="54" r="1.6"/><circle cx="58" cy="52" r="1.6"/><circle cx="42" cy="56" r="1.6"/></g><path d="M38 40L62 62" stroke="#8B4A22" stroke-width="3" stroke-linecap="round"/>',
causa:'<rect x="26" y="38" width="48" height="10" rx="3" fill="#F4C842"/><rect x="26" y="48" width="48" height="8" rx="3" fill="#F6E7B0"/><rect x="26" y="56" width="48" height="10" rx="3" fill="#F4C842"/><circle cx="40" cy="36" r="5" fill="#8DB360"/><circle cx="54" cy="35" r="5" fill="#8DB360"/><circle cx="66" cy="37" r="4" fill="#C8553D"/>',
mazamorra:'<circle cx="50" cy="50" r="26" fill="#6E3A6B"/><circle cx="50" cy="50" r="20" fill="#8A4C86"/><g fill="#F2C94C"><circle cx="44" cy="46" r="3"/><circle cx="56" cy="54" r="3"/></g><g fill="#fff"><circle cx="54" cy="42" r="2.2"/><circle cx="45" cy="57" r="2.2"/></g>'};
/* Plato ilustrado; si existe fotos/{id}.jpg se muestra encima (versión GitHub Pages) */
const plate=r=>`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="${PB[r.id]}"/><circle cx="50" cy="52" r="40" fill="rgba(0,0,0,.08)"/><circle cx="50" cy="50" r="40" fill="#fff"/><circle cx="50" cy="50" r="33" fill="#F6F2EC"/>${PF[r.id]}</svg><img src="${IMG[r.id]||'fotos/'+r.id+'.jpg'}" alt="" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`;
const card=r=>`<div class="vc" onclick="openR('${r.id}')"><div class="art">${plate(r)}</div><div class="vb"><b>${r.n}</b><small>${r.t} · ${r.p} porciones</small></div><button class="heart" aria-label="Favorita" onclick="event.stopPropagation();fav('${r.id}')">${isFav(r.id)?'♥':'♡'}</button></div>`;
function openR(id){S.rid=id;render();scrollTo(0,0)}
function tab(t){S.tab=t;S.rid=null;S.sel=null;if(t!=='well')S.chat=[];render();scrollTo(0,0)}
/* ===== Pantallas ===== */
function vHome(){const l=S.cat==='Todas'?R:R.filter(r=>r.c===S.cat);const d=R[0];
return `<input type="search" placeholder="¿Qué quieres cocinar hoy?" readonly onclick="tab('search')" style="border-radius:24px"><div class="hero"><div><small>Receta del día</small><h2>${d.n}</h2><small>⏱ ${d.t} · ${d.d}</small><br><button class="chip" style="margin-top:10px;background:var(--mos);border-color:var(--mos);color:#2A2230" onclick="openR('${d.id}')">Ver receta</button></div><div class="e">${plate(d)}</div></div>
<div class="chips">${['Todas','Fondo','Postres','Rápidas'].map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';render()">${c==='Fondo'?'Platos de fondo':c}</button>`).join('')}</div>
<h3 style="margin-bottom:10px">Recetas populares</h3><div class="grid">${l.map(card).join('')}</div>`}
function vSearch(){const q=norm(S.q);const l=q?R.filter(r=>norm(r.n+' '+r.g.join(' ')).includes(q)):R;
return `<input type="search" id="q" placeholder="Busca por receta o ingrediente" value="${S.q}" oninput="S.q=this.value;sres()" autocomplete="off"><div id="res" class="grid">${l.map(card).join('')||'<p class="note">No encontramos recetas con eso.</p>'}</div>`}
function sres(){const q=norm(S.q);const l=q?R.filter(r=>norm(r.n+' '+r.g.join(' ')).includes(q)):R;$('#res').innerHTML=l.map(card).join('')||'<p class="note">No encontramos recetas con eso.</p>'}
function vFav(){const l=R.filter(r=>isFav(r.id));return l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<p class="note">Aún no tienes recetas favoritas. Toca el corazón en cualquier receta para guardarla aquí.</p>'}
function vRec(){const r=rec(S.rid);
return `<button class="chip" onclick="S.rid=null;render()">← Volver</button><div style="height:10px"></div>
<div class="art big">${plate(r)}</div><h2>${r.n}</h2><p class="note">⏱ ${r.t} · ${r.p} porciones · ${r.d}</p>
<h3>Ingredientes</h3><ul class="ing">${r.g.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Preparación</h3><ol>${r.s.map(x=>`<li>${x}</li>`).join('')}</ol>
<div class="row" style="margin-top:14px"><button class="btn alt" style="flex:1" onclick="fav('${r.id}')">${isFav(r.id)?'♥ En favoritas':'♡ Favorita'}</button><button class="btn" style="flex:1" onclick="share('${r.id}')">Compartir</button></div>`}
function vShops(){const l=S.ally?T.filter(t=>t.a):T;
const pins=l.map(t=>`<g onclick="S.sel=${T.indexOf(t)};render()" style="cursor:pointer"><circle cx="${t.x}" cy="${t.y}" r="15" fill="${t.a?'#5A2A6B':'#B3A9B8'}" stroke="#fff" stroke-width="2"/><text x="${t.x}" y="${t.y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${t.tp[0]}</text>${t.a?`<circle cx="${t.x+11}" cy="${t.y-10}" r="5" fill="#E8A93B" stroke="#fff" stroke-width="2"/>`:''}</g>`).join('');
return `<h2 style="margin-bottom:4px">Dónde comprar los ingredientes</h2><p class="note" style="margin-top:0">Tiendas cercanas (datos de ejemplo)</p>
<div class="chips"><button class="chip ${S.ally?'':'on'}" onclick="S.ally=false;render()">Todas</button><button class="chip ${S.ally?'on':''}" onclick="S.ally=true;render()">Tiendas aliadas</button></div>
<div id="lmap" class="map" style="height:260px"></div><div id="svgmap" style="display:none"><svg class="map" viewBox="0 0 360 240" role="img" aria-label="Mapa de tiendas"><rect width="360" height="240" fill="#EFEAF2"/><path d="M0 110H360M0 30H360M0 200H360M130 0V240M250 0V240M40 0V240M330 0V240" stroke="#fff" stroke-width="9"/><path d="M0 110H360M130 0V240" stroke="#F8D98C" stroke-width="3" opacity=".6"/><rect x="140" y="125" width="100" height="65" rx="8" fill="#CFE0BC"/>${pins}</svg></div>
${l.map(t=>`<div class="rc" onclick="S.sel=${T.indexOf(t)};render()"><div class="art" style="background:${t.a?'#FBEBC8':'#F1ECF3'};color:${t.a?'#7A4B00':'#8A8190'};font:700 22px Fraunces,serif">${t.tp[0]}</div><div><b>${t.n}${t.a?'<span class="tag">Aliada</span>':''}</b><small>${t.tp} · ${t.d} · ${t.h}</small></div></div>`).join('')}`}
function vWell(){return `<h2 style="margin-bottom:10px">Cocina y bienestar</h2>${ART.map(a=>`<details><summary>${a[0]}</summary><p>${a[1]}</p></details>`).join('')}
<div class="card"><h3 style="margin-bottom:8px">Teléfonos útiles</h3>
<p style="margin:6px 0"><a href="tel:100" class="btn" style="display:block;text-align:center;text-decoration:none">Línea 100 · gratuita, 24 horas</a></p>
<div class="row"><a href="tel:105" class="btn alt" style="flex:1;text-align:center;text-decoration:none">Policía 105</a><a href="tel:106" class="btn alt" style="flex:1;text-align:center;text-decoration:none">SAMU 106</a></div></div>
<div class="card"><h3 style="margin-bottom:8px">Pregúntale a la cocinera</h3><div class="msgs" id="msgs">${chatH()}</div><div class="row"><input type="text" id="ci" placeholder="Escribe tu pregunta" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Enviar</button></div>
<p class="note" style="margin:8px 0 0">No reemplaza a un profesional ni a los servicios de emergencia. La conversación no se guarda.</p></div>`}
const chatH=()=>S.chat.length?S.chat.map(m=>`<div class="m ${m.u?'u':'b'}">${m.t}</div>`).join(''):'<div class="m b">¡Hola! Puedo darte consejos de cocina o escucharte con calma.</div>';
function send(){const i=$('#ci');const v=i.value.trim();if(!v)return;const n=norm(v);let r;
if(/miedo|golpe|pega|grita|amenaz|controla|celular|no puedo salir|violen|maltrat|dano|asust|triste|sola/.test(n))r='Gracias por contármelo. Lo que sientes importa y no estás sola. Si estás en peligro ahora, llama al 105. La Línea 100 es gratuita y atiende las 24 horas; puedes llamar cuando estés a salvo. También ayuda hablar con una persona de confianza. Aquí no guardo nuestra conversación.';
else if(/arroz/.test(n))r='Para un arroz suelto, enjuágalo bien y usa 2 tazas de agua por taza de arroz.';
else if(/cebolla/.test(n))r='Si la cebolla te hace llorar, enfríala 15 minutos antes de cortarla.';
else if(/sal/.test(n))r='Si te pasaste de sal, agrega una papa cruda en cuartos y retírala al final.';
else r='Cuéntame qué estás preparando y te doy un consejo.';
S.chat.push({u:1,t:v.replace(/</g,'&lt;')},{t:r});$('#msgs').innerHTML=chatH();i.value='';$('#msgs').scrollTop=9999}
/* ===== Hojas y navegación ===== */
function vSheet(){if(S.sel!==null){const t=T[S.sel];return `<div class="sheet" onclick="S.sel=null;render()"><div onclick="event.stopPropagation()"><h2>${t.n}${t.a?'<span class="tag">Aliada</span>':''}</h2><p>${t.tp} · ${t.d}<br>${t.h}<br>${t.ad}</p><button class="btn" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${t.la},${t.lo}&travelmode=walking','_blank')">Cómo llegar</button></div></div>`}
if(S.sheet)return `<div class="sheet" onclick="S.sheet=null;render()"><div onclick="event.stopPropagation()"><h2 style="margin-bottom:12px">Ajustes</h2><button class="btn alt" onclick="clearAll()">Borrar mis datos</button><p class="note" style="margin:12px 0 4px">Recetario Casero · versión de ejemplo.</p></div></div>`;return ''}
function vApp(){const t=S.tab;const ti={home:['Recetario Casero','¿Qué cocinamos hoy?'],search:['Buscar','Recetas e ingredientes'],fav:['Favoritas','Tus recetas guardadas'],shop:['Tiendas',''],well:['Bienestar','']}[t];
const body=S.rid?vRec():{home:vHome,search:vSearch,fav:vFav,shop:vShops,well:vWell}[t]();
return `<div class="top"><div><h1>${S.rid?'':ti[0]}</h1><small>${S.rid?'':ti[1]}</small></div><button class="gear" aria-label="Ajustes" onclick="S.sheet=1;render()">⚙</button></div>${body}${vSheet()}
<nav>${[['home',ic('<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'),'Inicio'],['search',ic('<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>'),'Buscar'],['fav',ic('<path d="M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z"/>'),'Favoritas'],['shop',ic('<path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 016 0v2"/>'),'Tiendas'],['well',ic('<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l8-8"/>'),'Bienestar']].map(n=>`<button class="${S.tab===n[0]?'on':''}" onclick="tab('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`}
/* ===== Configuración (solo por #setup) ===== */
function vSetup(){const s=ST.step;let b='';
if(s===0)b=`<h2>Bienvenida a Recetario Casero</h2><p>Elige tu receta favorita. Será la primera de tu lista de favoritas.</p>${R.map(r=>`<div class="rc" onclick="ST.trust='${r.id}';render()" style="${ST.trust===r.id?'border-color:var(--terra);border-width:2px':''}"><div class="art">${plate(r)}</div><div><b>${r.n}</b></div><span class="heart">${ST.trust===r.id?'♥':'♡'}</span></div>`).join('')}`;
if(s===1)b=`<h2>¿Con quién compartes tus recetas?</h2><p>Agrega 2 o 3 personas de confianza.</p>${navigator.contacts&&navigator.contacts.select?'<button class="btn alt" style="margin-bottom:12px" onclick="pick()">Elegir de mi agenda</button>':''}${ST.c.map((c,i)=>`<input type="text" placeholder="Nombre o apodo ${i+1}" value="${c.n}" oninput="ST.c[${i}].n=this.value"><input type="tel" placeholder="Número de celular" value="${c.p}" oninput="ST.c[${i}].p=this.value">`).join('')}<p class="note" id="err"></p>`;
if(s===2)b=`<h2>Permite tu ubicación para ver tiendas cercanas</h2><p>Así podremos mostrarte las tiendas más próximas a ti. Solo se usa en tu celular.</p><button class="btn alt" onclick="askLoc()">Permitir ubicación</button><p class="note" id="err"></p>`;
if(s===3)b=`<h2>¡Listo!</h2><p>Tu recetario está configurado. Ya puedes explorar tus recetas.</p>`;
return `<div class="bar"><i style="width:${(s+1)*25}%"></i></div>${b}<div class="row" style="margin-top:14px">${s>0&&s<3?'<button class="btn alt" onclick="ST.step--;render()">Atrás</button>':''}<button class="btn" onclick="next()">${s===3?'Ir a mis recetas':'Continuar'}</button></div>`}
async function pick(){try{const r=await navigator.contacts.select(['name','tel'],{multiple:true});r.slice(0,3).forEach((x,i)=>{ST.c[i]={n:(x.name||[''])[0],p:(x.tel||[''])[0]}});render()}catch(e){}}
function askLoc(){try{navigator.geolocation.getCurrentPosition(x=>{loc=[x.coords.latitude,x.coords.longitude];$('#err').textContent='Listo, gracias.'},()=>{$('#err').textContent='Puedes continuar sin ubicación.'})}catch(e){$('#err').textContent='Puedes continuar sin ubicación.'}}
function next(){const s=ST.step;
if(s===0&&!ST.trust)return;
if(s===1){const ok=ST.c.filter(c=>c.n.trim()&&c.p.replace(/\D/g,'').length>=9);if(ok.length<2){$('#err').textContent='Agrega al menos 2 personas con su número.';return}}
if(s===3){store.set('trust',ST.trust);store.set('contacts',ST.c.filter(c=>c.n.trim()));const f=[ST.trust,...R.map(r=>r.id).filter(x=>x!==ST.trust).slice(0,2)];store.set('fav',f);history.replaceState(null,'',location.pathname+location.search);mode='app';S.tab='fav';render();return}
ST.step++;render()}
/* ===== Demo para el pitch (solo por #demo) ===== */
const DS=['Lo que ella hace: abre Favoritas, entra a su receta de confianza y toca Compartir. Son 3 toques y la pantalla se ve como siempre.','Lo que la tía recibe: un mensaje de apariencia familiar con un enlace a la ubicación de Ana. Por el pacto acordado, sabe que significa que Ana necesita ayuda.','Lo que la tía hace: no llama a Ana, avisa al 105 o a la Línea 100 y acude al lugar indicado.'];
let dstep=0;
function vDemo(){return `<h2>Demo: el otro lado del mensaje</h2><p class="note">Pantalla solo para exponer al jurado.</p>
<div class="wa"><p class="note" style="margin:0 0 8px"><b>Tía Rosa</b></p><div class="bub">Te paso la receta de mi arroz con leche, ven a probarla<div class="lk">📍 maps.google.com/?q=-12.0965,-77.0365</div></div></div>
<div class="card">${DS[dstep]}</div><div class="row"><button class="btn alt" onclick="dstep=Math.max(0,dstep-1);render()">Anterior</button><button class="btn" onclick="dstep=Math.min(2,dstep+1);render()">Siguiente</button></div>
<p class="note">Paso ${dstep+1} de 3</p>`}
/* ===== Arranque ===== */
function initMap(){const el=$('#lmap');if(!el)return;
if(!window.L){el.style.display='none';$('#svgmap').style.display='block';return}
try{const l=S.ally?T.filter(t=>t.a):T;const m=L.map('lmap',{zoomControl:true,attributionControl:true}).setView([-11.9930,-77.0080],15);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles © Esri'}).addTo(m);
l.forEach(t=>{const i=L.divIcon({className:'',iconSize:[26,26],html:'<div style="width:26px;height:26px;border-radius:50%;background:'+(t.a?'#5A2A6B':'#B3A9B8')+';border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>'});
L.marker([t.la,t.lo],{icon:i,title:t.n}).addTo(m).on('click',()=>{S.sel=T.indexOf(t);render()})})}
catch(e){el.style.display='none';$('#svgmap').style.display='block'}}
function render(){$('#root').innerHTML=mode==='setup'?vSetup():mode==='demo'?vDemo():vApp();if(mode==='app'&&S.tab==='shop'&&!S.rid)initMap()}
function route(){const h=location.hash;mode=h==='#setup'?'setup':h==='#demo'?'demo':'app';render()}
addEventListener('hashchange',route);refreshLoc();route();
</script>
</body>
</html>
