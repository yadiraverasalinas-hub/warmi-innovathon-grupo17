      .label { font: 700 13px "Segoe UI", Arial, sans-serif; letter-spacing: 1.4px; fill: #756c79; }
      .body { font: 14px "Segoe UI", Arial, sans-serif; fill: #2a2230; }
      .small { font: 12px "Segoe UI", Arial, sans-serif; fill: #756c79; }
