<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="title description">
  <title id="title">Propuesta B: acceso a Bienestar desde Preferencias</title>
  <desc id="description">Prototipo estático de Preferencias y Bienestar en móvil, más una vista de Preferencias en escritorio. La navegación principal conserva cuatro destinos del recetario.</desc>
